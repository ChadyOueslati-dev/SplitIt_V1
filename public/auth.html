<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/js/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <title>Sign in — SplitIt</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">Split<span>It</span></a>
      </div>
    </header>

    <main class="wrap" style="max-width: 460px">
      <p class="eyebrow">Account</p>
      <h1 id="auth-title" style="font-size: 2rem">Sign in</h1>
      <p class="muted" id="auth-blurb"></p>

      <div id="auth-message"></div>

      <form class="card" id="auth-form" autocomplete="on">
        <div class="field" id="name-field" hidden>
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="currency">Preferred currency</label>
          <select id="currency" name="currency">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
          </select>
        </div>
        <button id="auth-submit" type="submit">Sign in</button>
        <button class="quiet" id="auth-toggle" type="button" style="margin-left: 0.5rem"></button>
      </form>

      <p class="small muted" style="margin-top: 1rem" id="forgot-link">
        Forgot your password? <a href="/reset.html">Reset it</a>.
      </p>
      <p class="small muted">
        Just have a group code? <a href="/join.html">Join without an account</a>.
      </p>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
